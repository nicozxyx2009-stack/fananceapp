<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Fundo escuro que aparece atrás da sidebar quando aberta no celular -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <svg class="sidebar__logo" viewBox="0 0 32 32" width="28" height="28">
        <path d="M2 20 L9 14 L14 18 L21 8 L30 12" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>FinanceApp</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer">
      <p>Protótipo · dados fictícios</p>
    </div>
  </aside>

  <div class="app-shell">
    <header class="app-header">
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
      <h2 id="header-title">Dashboard</h2>
      <div class="header-account">
        <span id="header-user-name"></span>
        <span class="header-account__avatar" id="header-user-initial"></span>
      </div>
    </header>

    <main class="app-main" id="main-content">
      <!-- Cada página é injetada aqui pelo router.js -->
    </main>
  </div>

  <!-- Modais são injetados aqui, fora do fluxo normal, pra ficar por cima de tudo -->
  <div id="modal-root"></div>

  <!-- Ordem importa: dados/serviços primeiro, depois quem usa eles -->
  <script src="js/data/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/services/calculations.js"></script>
  <script src="js/services/forecast.js"></script>
  <script src="js/services/alerts.js"></script>
  <script src="js/services/insights.js"></script>
  <script src="js/services/fakeBank.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/components.js"></script>

  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transacoes.js"></script>
  <script src="js/pages/contas.js"></script>
  <script src="js/pages/gastos.js"></script>
  <script src="js/pages/previsoes.js"></script>
  <script src="js/pages/metas.js"></script>
  <script src="js/pages/alertas.js"></script>
  <script src="js/pages/simulador.js"></script>
  <script src="js/pages/investimentos.js"></script>
  <script src="js/pages/analises.js"></script>
  <script src="js/pages/configuracoes.js"></script>

  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
